<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Score Prediction Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .header h1:hover {
            transform: scale(1.08);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            font-weight: 300;
            transition: all 0.3s ease;
        }
        
        .header:hover p {
            transform: translateX(10px);
            opacity: 1;
        }
        
        .login {
            max-width: 550px;
            width: 100%;
            background: white;
            padding: 45px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease-out;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .login:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-group {
            margin-bottom: 22px;
            animation: floatIn 0.5s ease-out forwards;
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        
        .form-group:hover {
            transform: translateX(5px);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.95em;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            transform-origin: left center;
        }
        
        .form-group:hover label {
            color: #667eea;
            transform: translateX(5px) scale(1.05);
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-color: #f7fafc;
            font-family: inherit;
            transform-origin: center;
            position: relative;
            pointer-events: auto;
        }
        
        select:hover, input[type="number"]:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15), inset 0 0 10px rgba(102, 126, 234, 0.05);
            transform: scale(1.02) translateY(-2px);
        }
        
        input[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        input[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        input[type="submit"]:hover::before {
            left: 100%;
        }
        
        input[type="submit"]:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 45px rgba(102, 126, 234, 0.5), 0 0 30px rgba(118, 75, 162, 0.3);
            letter-spacing: 1px;
        }
        
        input[type="submit"]:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            text-align: center;
            font-size: 1.1em;
            border-radius: 8px;
            font-weight: 600;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        
        .result:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 50px rgba(245, 87, 108, 0.5);
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .footer {
            margin-top: 40px;
            text-align: center;
            color: white;
            font-size: 0.9em;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .footer:hover {
            opacity: 1;
            transform: scale(1.05);
        }
        
        .footer p {
            margin: 5px 0;
            transition: all 0.3s ease;
        }
        
        .footer p:hover {
            transform: translateY(-3px);
        }
        
        .nexus-credit {
            font-weight: 600;
            color: #ffd700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: inline-block;
            transform-origin: center;
        }
        
        .nexus-credit:hover {
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            filter: brightness(1.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Math Score Predictor</h1>
        <p>Intelligent Student Performance Analysis</p>
    </div>
    
    <div class="login">
        <h1>Predict Math Score</h1>
        <form action="/predict" method="POST">
            
            <div class="form-group">
                <label>🚹 Gender</label>
                <select name="gender" required>
                    <option value="" disabled selected>Select your Gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
            </div>

            <div class="form-group">
                <label>🌍 Race/Ethnicity</label>
                <select name="race_ethnicity" required>
                    <option value="" disabled selected>Select Race/Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="form-group">
                <label>🎓 Parental Level of Education</label>
                <select name="parental_level_of_education" required>
                    <option value="" disabled selected>Select Parent's Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="form-group">
                <label>🍽️ Lunch Type</label>
                <select name="lunch" required>
                    <option value="" disabled selected>Select Lunch Type</option>
                    <option value="standard">Standard</option>
                    <option value="free/reduced">Free/Reduced</option>
                </select>
            </div>

            <div class="form-group">
                <label>📚 Test Preparation Course</label>
                <select name="test_preparation_course" required>
                    <option value="" disabled selected>Select Course Status</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label>📖 Reading Score (0-100)</label>
                <input type="number" name="reading_score" min="0" max="100" placeholder="Enter Reading Score" required>
            </div>

            <div class="form-group">
                <label>✏️ Writing Score (0-100)</label>
                <input type="number" name="writing_score" min="0" max="100" placeholder="Enter Writing Score" required>
            </div>

            <input type="submit" value="🎯 Predict Score">
        </form>
        {% if prediction_text %}
            <div class="result">
                 Predicted Math Score: {{ prediction_text }}
            </div>
        {% endif %}
    </div>
    
    <div class="footer">
        <p><span class="nexus-credit">🔬 Developed by <b><i>NOMAN ABDULLAH</i></b></span></p>
        <p>Powered by Nexus Lab</p>
    </div>
</body>
</html>
